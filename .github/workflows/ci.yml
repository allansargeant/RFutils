name: ci

# Typecheck, test and build all workspaces on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A package.json change with no package-lock change is a no-op under npm ci;
      # npm ls is what reports the resulting "invalid" dependency (#30, #31).
      - name: Lockfile matches manifest
        run: npm ls --all >/dev/null

      # shared must be built first: server/web resolve @rfutils/shared via its
      # published dist (types + js), and the tests import it too.
      - name: Build shared
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The site that Cloudflare serves, loaded in a real browser. A React major
      # mismatch (#22) built green and rendered only the footer for three weeks.
      - name: Build static site
        run: npm run build:static
      - name: Smoke-check the built site
        uses: stoatworks-labs/smoke-check@v1
        with:
          dir: packages/web/dist-static
