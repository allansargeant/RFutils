# Generated by stoatworks-unraid/scripts/gen-docker.mjs from fleet.json.
# Repo: RFutils. Edit fleet.json and regenerate — direct edits are overwritten.
#
# Pull the published image by default. Uncomment build: . to build from this
# checkout instead — useful when testing a change before it reaches GHCR.

services:
  rfutils:
    image: ghcr.io/stoatworks-labs/rfutils:latest
    # build: .
    container_name: rfutils
    restart: unless-stopped
    # Host networking is not a preference here. This app discovers devices with mDNS/broadcast, and Docker's bridge
    # network does not reliably forward multicast. In bridge mode discovery does
    # not error — it simply finds nothing, which reads as "no devices on the
    # network" rather than as a networking problem. Drop this and add a ports:
    # mapping if you would rather add devices by IP and keep the container
    # isolated.
    network_mode: host
    volumes:
      - ./config:/app/config
    environment:
      - RFUTILS_SERVER_PORT=8420
